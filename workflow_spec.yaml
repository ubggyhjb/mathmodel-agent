# MathModel Agent v4 工作流单一事实源（Single Source of Truth）
#
# 本文件定义阶段顺序/每个阶段的 skill/id/输入输出。以下组件全部以本文件为准，
# 任何地方都不得再手写一份阶段顺序：
#   - skills/1start-mathmodel/SKILL.md   -> 读取本文件生成 plan.md / todo.md
#   - agent.cordis.yml                  -> 工作流段必须与本文件一致（workflow_spec.py --check 校验）
#   - README.md / docs/WORKFLOW_v4.md    -> 阶段表由本文件生成
#   - skills/6verity/scripts/check_decision_log.py -> stages 列表由本文件加载
#   - skills/6verity/scripts/run_all_gates.py      -> 校验 decision_log 执行历史与本文件一致
#
# 修改流程：改本文件 -> 跑 `python <6verity>/scripts/workflow_spec.py --check --root <repo>`
# 验证所有引用方一致 -> 提交。

version: 4
workflow_id: "mathmodel-v4"

stages:
  - id: brainstorm
    skill: brainstorm-mathmodel
    inputs: []
    outputs:
      - "reports/contracts/QUESTION_CONTRACT.json"
      - "reports/contracts/IDEA_CANDIDATES.json"
      - "reports/contracts/IDEA_DECISION.json"
      - "reports/BRAINSTORM_REPORT.md"
    gate: idea_contracts
    purpose: "题意契约 + 受约束候选生成（minimal/recommended/advanced 三档）+ 淘汰状态机；禁止实验结论词；不直接形成可执行模型定义"
  - id: analysis
    skill: 2analysis-modeling
    inputs:
      - "reports/contracts/QUESTION_CONTRACT.json"
      - "reports/contracts/IDEA_CANDIDATES.json"
      - "reports/contracts/IDEA_DECISION.json"
      - "reports/BRAINSTORM_REPORT.md"
    outputs: ["reports/ANALYSIS_MODELING_REPORT.md"]
    gate: ""
    purpose: "解析题意、识别变量/约束/数据/评价指标；众数解清单 + 差异化审查"
  - id: methodology_review
    skill: 7methodology-review
    inputs:
      - "reports/contracts/QUESTION_CONTRACT.json"
      - "reports/contracts/IDEA_CANDIDATES.json"
      - "reports/contracts/IDEA_DECISION.json"
      - "reports/ANALYSIS_MODELING_REPORT.md"
    outputs:
      - "reports/methodology/*.json"
      - "reports/FINAL_MODEL_SPEC.json"
      - "figures/figure_manifest.json"
    gate: methodology
    purpose: "DGP/假设/删失/退化/必要性/泄露/样本量审计；产出可执行模型契约 FINAL_MODEL_SPEC.json 与唯一 Figure Manifest（draft 状态，coding_visual 后置 approved）"
  - id: coding_visual
    skill: 3coding-visual
    inputs: ["reports/FINAL_MODEL_SPEC.json"]
    outputs:
      - "code/*.py"
      - "results/*.json"
      - "figures/*.pdf"
      - "figures/*.meta.json"
    gate: leakage
    purpose: "只实现 FINAL_MODEL_SPEC.json 声明的模型；结果 JSON 写 model_spec_sha256；图写 meta.json"
  - id: schematic
    skill: 4drawio
    inputs: ["reports/FINAL_MODEL_SPEC.json"]
    outputs: ["figures/*.tex|*.mmd|*.drawio"]
    gate: ""
    purpose: "仅当存在无法用正文/数据图表达的结构关系才画概念图（concept figure ≤1）"
  - id: writing
    skill: 5writing
    inputs:
      - "reports/FINAL_MODEL_SPEC.json"
      - "results/*.json"
      - "figures/*.meta.json"
      - "paper/generated_values.tex"
    outputs: ["paper/main.tex|main.typ", "paper/sections/*"]
    gate: figure_story
    purpose: "数值来源二选一（numeric_source_policy.mode=one_of）：generated_values.tex（recommended）或 results/*.json 权威 trace 闭环，二者选一即可，禁止无源数值；caption 由 figure manifest 生成；模型缺点随契约失效"
    numeric_source_policy:
      mode: one_of
      alternatives:
        - generated_values
        - authority_trace
  - id: verification
    skill: 6verity
    inputs:
      - "paper/main.tex|main.typ"
      - "paper/sections/*"
      - "results/*.json"
      - "figures/*.pdf"
      - "figures/figure_manifest.json"
      - "figures/*.meta.json"
      - "reports/FINAL_MODEL_SPEC.json"
      - "reports/methodology/*.json"
    outputs: ["reports/gates/*.json", "reports/VERIFY_REPORT.md"]
    gate: run_all_gates
    purpose: "v4.1（R-02）：验证器输入=论文/结果/图/清单/契约/方法学 JSON——不得把自产的 gates_report 当输入（无自输入循环）；输出门禁报告与验收报告"

gates_pipeline:
  # run_all_gates.py 的执行顺序（也是 README/文档中的门禁清单事实源）
  - manifest
  - layout
  - text_integrity
  - trace
  - style
  - decision
  - refs
  - methodology
  - leakage
  - figure_story
  - idea_contracts
  - visual_review_gate
  - figure_spec

final_review:
  personas:
    - id: A
      name: 数学建模专家
      scope: 问题抽象/优化模型/模型必要性/结论匹配度
    - id: B
      name: 统计与机器学习审稿人
      scope: independence/repeated measures/censoring/leakage/bias/threshold selection/CI/overfitting
    - id: C
      name: 科学编辑与视觉审稿人
      scope: 摘要/图/表/标粗/视觉层级/30秒可理解; page composition（orphan spill/recoverable underfill/float placement/first-reference proximity）
  veto:
    - "Reviewer B critical: leakage / wrong likelihood / invalid censoring / invalid test protocol"
    - "Reviewer C submission blocker: figure blank / table clipped / unresolved reference / orphan spill / near-empty continuation page / isolated heading或caption / broken abstract-keywords"
  pass_rule: "总分 ≥70 且核心维度（建模求解、结果检验）≥该维满分50%，其余维度≥40%"

# v4.3：机器可读控制面——工作流依赖 verdict 字段驱动，禁止自然语言"建议考虑"式回滚
control_plane:
  verdicts: ["PASS", "WARN", "BLOCKER", "CRITICAL"]
  failure_events: "reports/methodology/failure_events.json"
  failure_events_schema:
    code: string          # 如 PARSIMONY_PRIMARY_LOST
    severity: "blocker | critical"
    invalidate: ["<result key / model id>"]
    return_to: string     # 如 methodology_review / coding_visual
    status: "open | resolved"
    resolved_at: string   # status=resolved 时必填
  rules:
    - "任一 failure.event severity∈{blocker,critical} 且 status=open -> 最终验收 BLOCKER（methodology gate FAIL）"
    - "典型触发：assumption failed / family selection leakage / model has no practical gain / optimization degenerates / simpler model dominates / calibration failed but probability wording required / result contradicts core hypothesis"
    - "不能让 Agent 为『把原计划写圆』而继续推向论文阶段：failure event 的 return_to 即机器化回滚目标阶段"

